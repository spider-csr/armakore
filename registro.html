<!DOCTYPE html>

    <script>

    <style>
        body { background-color: #030303; color: #ffffff; overflow-x: hidden; }

            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);

</head>
<body class="min-h-screen flex flex-col font-sans selection:bg-white selection:text-black bg-grid">

    <!-- Navbar Universal -->
    <nav class="fixed top-0 z-50 w-full bg-brand-bg/90 backdrop-blur-md border-b border-brand-border">
        <div class="max-w-[90rem] mx-auto px-4 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3 shrink-0">
                <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 008.716-6.747M12 21a9.004 9.004 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 017.843 4.582M12 3a8.997 8.997 0 00-7.843 4.582m15.686 0A11.953 11.953 0 0112 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0121 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0112 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 013 12c0-1.605.42-3.113 1.157-4.418" />
                </svg>
                <span class="text-sm font-bold tracking-[0.2em] text-white">ARMAKORE</span>
            </a>
            
            <div class="hidden xl:flex items-center space-x-6">
                <a href="index.html" class="text-[11px] font-medium text-gray-500 hover:text-white transition-colors tracking-wider uppercase">Inicio</a>
                <a href="laptops.html" class="text-[11px] font-medium text-gray-500 hover:text-white transition-colors tracking-wider uppercase">Laptops</a>
                <a href="escritorio.html" class="text-[11px] font-medium text-gray-500 hover:text-white transition-colors tracking-wider uppercase">Escritorios</a>
                <a href="componentes.html" class="text-[11px] font-medium text-gray-500 hover:text-white transition-colors tracking-wider uppercase">Componentes</a>
                <a href="personalizacion.html" class="text-[11px] font-medium text-gray-500 hover:text-white transition-colors tracking-wider uppercase">Personalización PC</a>

            </div>
            
            <div class="flex items-center space-x-5 shrink-0">
                <div class="hidden lg:flex items-center bg-[#111] border border-[#222] rounded-full px-3 py-1.5 focus-within:border-gray-500 transition-colors w-48">
                    <input type="text" placeholder="Buscar..." class="bg-transparent border-none outline-none text-xs text-white placeholder-gray-600 w-full">
                    <svg class="w-3.5 h-3.5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <a href="inicio-sesion.html" class="text-white flex items-center gap-2 group">

                </a>
                <a href="carrito.html" aria-label="Carrito" class="text-gray-400 hover:text-white transition-colors relative group">
                    <svg class="w-5 h-5 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 0a2 2 0 100 4 2 2 0 000-4z"></path></svg>

    <!-- Contenedor Central -->
    <main class="flex-grow flex items-center justify-center relative px-4 pt-24 pb-12">
        <!-- Luz de fondo ambiental -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] bg-white/5 blur-[100px] rounded-full pointer-events-none z-0"></div>

        <!-- Tarjeta de Registro -->
        <div class="relative z-10 w-full max-w-md bg-brand-surface border border-brand-border rounded-2xl p-8 sm:p-10 shadow-2xl">
            
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-white tracking-tight mb-2">Crear Cuenta</h1>
                <p class="text-sm text-gray-500">Únete a la revolución modular de ARMAKORE</p>
            </div>

            <!-- Contenedor de campos sin <form> -->
            <div class="space-y-5">
                <!-- Nombre -->
                <div>
                    <label for="nombre" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Nombre Completo</label>
                    <input type="text" id="nombre" required 
                        class="w-full bg-[#111] border border-[#222] text-white rounded-lg px-4 py-2.5 outline-none transition-all focus:border-white focus:ring-1 focus:ring-white input-glow"
                        placeholder="Ej. Johan Zari">
                </div>

                <!-- Correo -->
                <div>
                    <label for="email" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Correo Electrónico</label>
                    <input type="email" id="email" required 
                        class="w-full bg-[#111] border border-[#222] text-white rounded-lg px-4 py-2.5 outline-none transition-all focus:border-white focus:ring-1 focus:ring-white input-glow"
                        placeholder="tu@correo.com">
                </div>

                <!-- Contraseña con Ojito -->
                <div>
                    <label for="password" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Contraseña</label>
                    <div class="relative">
                        <input type="password" id="password" required 
                            class="w-full bg-[#111] border border-[#222] text-white rounded-lg px-4 py-2.5 pr-12 outline-none transition-all focus:border-white focus:ring-1 focus:ring-white input-glow"
                            placeholder="••••••••">
                        <button type="button" onclick="togglePassword('password', 'eye-icon-1')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white transition-colors">
                            <svg id="eye-icon-1" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Verificar Contraseña con Ojito -->
                <div>
                    <label for="verify-password" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Verificar Contraseña</label>
                    <div class="relative">
                        <input type="password" id="verify-password" required 
                            class="w-full bg-[#111] border border-[#222] text-white rounded-lg px-4 py-2.5 pr-12 outline-none transition-all focus:border-white focus:ring-1 focus:ring-white input-glow"
                            placeholder="••••••••">
                        <button type="button" onclick="togglePassword('verify-password', 'eye-icon-2')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white transition-colors">
                            <svg id="eye-icon-2" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Botón Principal (Convertido a enlace para evitar el 405) -->
                <p id="form-error" role="alert" class="hidden text-sm text-red-300 bg-red-950/40 border border-red-900 rounded-lg px-4 py-3"></p>
                <button type="button" id="register-btn" class="w-full block text-center bg-white text-black font-bold text-sm py-3.5 rounded-lg hover:bg-gray-200 transition-colors mt-4 shadow-[0_0_15px_rgba(255,255,255,0.1)] hover:shadow-[0_0_25px_rgba(255,255,255,0.3)]">Registrarse</button>
            </div>

            <!-- Separador -->
            <div class="flex items-center gap-4 my-6">
                <div class="flex-1 h-[1px] bg-brand-border"></div>
                <span class="text-[10px] text-gray-600 font-semibold tracking-widest uppercase">O continuar con</span>
                <div class="flex-1 h-[1px] bg-brand-border"></div>
            </div>

            <!-- Botones Sociales (Cuadrícula 2x2) -->
            <div class="grid grid-cols-2 gap-3">
                <!-- Google -->
                <button class="flex items-center justify-center gap-2 bg-[#111] border border-[#222] hover:bg-[#1a1a1a] hover:border-gray-500 transition-colors py-2 rounded-lg text-xs font-medium text-white">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z"/></svg>
                    Google
                </button>
                <!-- Apple -->
                <button class="flex items-center justify-center gap-2 bg-[#111] border border-[#222] hover:bg-[#1a1a1a] hover:border-gray-500 transition-colors py-2 rounded-lg text-xs font-medium text-white">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M16.365,21.424c-1.282,0.852-2.312,0.781-3.619,0.119c-1.395-0.706-2.585-0.669-3.953,0.134c-2.33,1.36-4.577,0.174-5.942-1.921c-2.628-4.043-3.056-9.761-0.279-12.784c1.378-1.5,3.313-1.895,4.697-1.895c1.298,0,2.443,0.589,3.337,1.077c0.803,0.439,1.442,0.443,2.052,0.13c1.082-0.556,2.23-1.222,3.953-1.222c2.091,0,3.876,0.92,4.898,2.378c-2.096,1.218-1.744,4.281,0.404,5.321c-0.493,1.542-1.155,3.16-2.128,4.526C18.665,18.898,17.728,20.518,16.365,21.424z M15.166,4.729c0.75-0.908,1.15-2.001,1.111-3.21c-1.075,0.065-2.376,0.725-3.159,1.604c-0.672,0.75-1.171,1.865-1.088,3.033C13.238,6.236,14.417,5.637,15.166,4.729z"/></svg>
                    Apple
                </button>
                <!-- Facebook -->
                <button class="flex items-center justify-center gap-2 bg-[#111] border border-[#222] hover:bg-[#1a1a1a] hover:border-gray-500 transition-colors py-2 rounded-lg text-xs font-medium text-white">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M14 13.5h2.5l1-4H14v-2c0-1.03 0-2 2-2h1.5V2.14c-.326-.043-1.557-.14-2.857-.14C11.928 2 10 3.657 10 6.7v2.8H7v4h3V22h4v-8.5z"/></svg>
                    Facebook
                </button>
                <!-- X (Twitter) -->
                <button class="flex items-center justify-center gap-2 bg-[#111] border border-[#222] hover:bg-[#1a1a1a] hover:border-gray-500 transition-colors py-2 rounded-lg text-xs font-medium text-white">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg>
                    X
                </button>
            </div>
            
            <!-- Link a Iniciar Sesión -->
            <div class="mt-8 text-center">
                <span class="text-xs text-gray-500">¿Ya tienes una cuenta?</span>
                <a href="inicio-sesion.html" class="text-xs font-semibold text-white hover:underline ml-1">Iniciar sesión</a>
            </div>

        </div>
    </main>

    <!-- Script para los "Ojitos" de la contraseña -->
    <script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (input.type === "password") {
                input.type = "text";
                // Cambia el ícono al ojito tachado
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />';
            } else {
                input.type = "password";
                // Vuelve al ojito normal
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />';
            }
        }
    </script>

<script src="armakore.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const next = AK.safeNext(AK.qs('next')) || 'dashboard.html';
    if (AK.currentUser() && !AK.qs('cambiar')) { location.replace(next); return; }

    const ids = ['nombre', 'email', 'password', 'verify-password'];
    const f = Object.fromEntries(ids.map(id => [id, document.getElementById(id)]));
    const btn = document.getElementById('register-btn');
    const err = document.getElementById('form-error');

    function showError(msg, field) {
        err.textContent = msg; err.classList.remove('hidden');
        ids.forEach(id => f[id].classList.remove('border-red-500'));
        if (f[field]) { f[field].classList.add('border-red-500'); f[field].focus(); }
    }
    function clearError() { err.classList.add('hidden'); ids.forEach(id => f[id].classList.remove('border-red-500')); }
    ids.forEach(id => {
        f[id].addEventListener('input', clearError);
        f[id].addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    });

    function submit() {
        clearError();
        btn.disabled = true; btn.textContent = 'Creando cuenta…';
        setTimeout(() => {
            const r = AK.register({ name: f.nombre.value, email: f.email.value, password: f.password.value, confirm: f['verify-password'].value });
            if (!r.ok) { btn.disabled = false; btn.textContent = 'Registrarse'; showError(r.error, r.field); return; }
            AK.toast('Cuenta creada. ¡Bienvenido, ' + r.user.name.split(' ')[0] + '!');
            setTimeout(() => { location.href = next; }, 600);
        }, 450);
    }
    btn.addEventListener('click', submit);

    // Botones sociales (simulados)
    document.querySelectorAll('button').forEach(b => {
        const provider = b.textContent.trim();
        if (!['Google', 'Apple', 'Facebook', 'X'].includes(provider)) return;
        b.addEventListener('click', () => {
            b.disabled = true; b.style.opacity = '.6';
            AK.toast('Conectando con ' + provider + ' (simulado)…');
            setTimeout(() => { AK.socialLogin(provider); location.href = next; }, 900);
        });
    });
});
</script>
</body>
